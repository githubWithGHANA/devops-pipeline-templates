version: 0.0
os: linux
files:
  - source: /
    destination: /opt/${APP_NAME:-app}
file_exists_behavior: OVERWRITE
hooks:
  ApplicationStop:
    - location: scripts/before_install.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: root

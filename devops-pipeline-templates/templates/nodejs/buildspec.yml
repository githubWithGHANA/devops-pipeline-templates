version: 0.2

env:
  shell: bash
  variables:
    AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ap-south-1}"
    ECR_REPOSITORY: "${ECR_REPOSITORY:-app}"
  exported-variables:
    - APP_IMAGE

phases:
  pre_build:
    on-failure: ABORT
    commands:
      - |
        set -euo pipefail
        cd "$CODEBUILD_SRC_DIR"
        docker info > /dev/null
        for script in scripts/*.sh; do bash -n "$script"; done
        export ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
        export IMAGE_TAG="build-${CODEBUILD_BUILD_NUMBER}-${CODEBUILD_BUILD_ID##*:}"
        export APP_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  build:
    on-failure: ABORT
    commands:
      - |
        set -euo pipefail
        cd "$CODEBUILD_SRC_DIR"
        docker build --pull -t "$APP_IMAGE" .

  post_build:
    on-failure: ABORT
    commands:
      - |
        set -euo pipefail
        test "$CODEBUILD_BUILD_SUCCEEDING" = "1"
        docker push "$APP_IMAGE"
        docker tag "$APP_IMAGE" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
        docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
        printf 'APP_IMAGE=%s\n' "$APP_IMAGE" > "$CODEBUILD_SRC_DIR/image_definition.env"

artifacts:
  files:
    - appspec.yml
    - docker-compose.yml
    - image_definition.env
    - scripts/**/*
    - deploy.env*
